services:
  mongo:
    image: mongo:7
    container_name: pokestock2-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pokestock2-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/pokestock
      - PORT=3000
    volumes:
      # ylläpidosta ladatut korttikuvat säilyvät konttia päivitettäessä
      - kuvat_data:/app/api/lataukset
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  kuvat_data:
